[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "boom-client"
dynamic = ["version"]
description = "Python client for the BOOM API: catalog queries, cone searches and aggregation pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "BOOM Team" }]
keywords = [
    "astronomy",
    "boom",
    "mongodb",
    "catalogs",
    "ztf",
    "lsst",
    "transients",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "babamul>=0.1.0",
    "astropy>=7.2.0",
    "httpx>=0.27.0",
    "pandas>=3.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
jupyter = [
    "ipywidgets>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/boom-astro/boom-client"
Repository = "https://github.com/boom-astro/boom-client"
Issues = "https://github.com/boom-astro/boom-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/boom"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 79
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "astropy.*",
    "babamul.*",
    "httpx.*",
    "matplotlib.*",
    "pandas.*",
    "pyarrow.*",
    "pytest.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "prek>=0.3.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "pandas-stubs",
    "ruff>=0.1.0",
    "python-dotenv>=1.0.0",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
]
